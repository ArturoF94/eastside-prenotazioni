<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Reservation Page" description="Nav, reservation form, footer — built from the East Side design system" -->
<helmet><script src="./ds-base.js"></script><style>footer img[src*="east-side-horizontal-white"]{display:none}
#es-fields input,#es-fields select{color:var(--es-ivory) !important}
#es-fields select option{color:#000}</style></helmet>
<div style="min-height:100vh;background:var(--es-midnight);color:var(--es-ivory)">
<div style="display:flex;justify-content:center;padding:56px 40px 0">
<img src="uploads/logo-east-side-documento.png" alt="East Side Pub &amp; Steakhouse" style="width:100%;max-width:360px;height:auto">
</div>
<div style="max-width:480px;margin:0 auto;padding:40px 40px 64px">
<span style="display:block;font-family:var(--es-font-ui);font-size:var(--es-text-sm);font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#6f9450">Prenotazione</span>
<h1 style="font-family:var(--es-font-ui);font-weight:700;text-transform:uppercase;letter-spacing:0.02em;font-size:36px;color:var(--es-ivory);margin:16px 0 12px">Prenota un tavolo</h1>
<div style="width:120px;height:3px;background:#6f9450;margin:0 0 28px"></div>
<div style="display:flex;flex-direction:column;gap:28px" id="es-fields">
<x-import component-from-global-scope="EastSideDesignSystem_ee2aed.Input" label="Nome" placeholder="Il tuo nome" hint-size="100%,70px"></x-import>
<x-import component-from-global-scope="EastSideDesignSystem_ee2aed.Input" label="Cognome" placeholder="Il tuo cognome" hint-size="100%,70px"></x-import>
<x-import component-from-global-scope="EastSideDesignSystem_ee2aed.Input" label="Telefono" type="tel" placeholder="+39" hint-size="100%,70px"></x-import>
<label style="display:block;font-family:var(--es-font-ui)">
<span style="display:block;font-family:var(--es-font-ui);font-size:var(--es-text-xs);font-weight:var(--es-weight-medium);text-transform:uppercase;letter-spacing:0.06em;color:var(--es-text-muted);margin-bottom:8px">Data</span>
<input type="date" id="es-data" style="width:100%;padding:8px 0;background:transparent;color:var(--es-text);border:none;border-bottom:1px solid var(--es-border);border-radius:0;font-family:var(--es-font-ui);font-size:var(--es-text-md);outline:none;color-scheme:dark">
</label>
<x-import component-from-global-scope="EastSideDesignSystem_ee2aed.Select" label="Persone" dc-props="{{ partySizes }}" hint-size="100%,70px"></x-import>
<x-import component-from-global-scope="EastSideDesignSystem_ee2aed.Select" label="Orario" dc-props="{{ times }}" hint-size="100%,70px"></x-import>
<x-import component-from-global-scope="EastSideDesignSystem_ee2aed.Button" hint-size="200px,52px">Invia richiesta</x-import>
<p id="es-status" role="status" style="font-family:var(--es-font-ui);font-size:var(--es-text-sm);min-height:1.4em;margin:0"></p>
</div>
</div>
<x-import component-from-global-scope="EastSideDesignSystem_ee2aed.Footer" hint-size="100%,220px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      partySizes: { options: ['2', '3', '4', '5', '6+'] },
      times: { options: ['17:00', '17:15', '17:30', '17:45', '18:00', '18:15', '18:30', '18:45', '19:00', '19:15', '19:30', '19:45', '20:00', '20:15', '20:30', '20:45', '21:00', '21:15', '21:30', '21:45', '22:00', '22:15', '22:30', '22:45', '23:00', '23:15', '23:30'] }
    };
  }
}
</script>
<iframe name="es-hidden-frame" style="display:none" title="invio prenotazione"></iframe>
<form id="es-gas-form" method="POST" target="es-hidden-frame" style="display:none">
<input type="hidden" name="nome">
<input type="hidden" name="cognome">
<input type="hidden" name="telefono">
<input type="hidden" name="data">
<input type="hidden" name="persone">
<input type="hidden" name="orario">
</form>
<script>
(function () {
  // URL "/exec" del deployment Apps Script pubblicato su eastsidepub20099@gmail.com.
  var GAS_URL = "https://script.google.com/macros/s/AKfycbznXYUUPm9_WZQ6TXGTvWBqAivEY0CsfQw3qHNY4YdCx9HKxQ9246cF8B28f__qXQQr/exec";

  var sending = false;

  var dataEl = document.getElementById('es-data');
  if (dataEl) {
    dataEl.min = new Date().toISOString().slice(0, 10);
  }

  document.body.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    handleSubmit(btn);
  });

  function handleSubmit(btn) {
    if (sending) return;

    var box = document.getElementById('es-fields');
    var status = document.getElementById('es-status');
    var textInputs = box.querySelectorAll('input');
    var selects = box.querySelectorAll('select');

    var nome = (textInputs[0] && textInputs[0].value || '').trim();
    var cognome = (textInputs[1] && textInputs[1].value || '').trim();
    var telefono = (textInputs[2] && textInputs[2].value || '').trim();
    var data = textInputs[3] ? textInputs[3].value : '';
    var persone = selects[0] ? selects[0].value : '';
    var orario = selects[1] ? selects[1].value : '';

    if (!nome || !cognome || !telefono || !data || !orario) {
      status.textContent = 'Compila tutti i campi, inclusa la data, prima di inviare.';
      status.style.color = '#c96a5a';
      return;
    }

    var telefonoPulito = telefono.replace(/[\s\-()]/g, '');
    if (!/^\+?[0-9]{8,15}$/.test(telefonoPulito)) {
      status.textContent = 'Inserisci un numero di telefono valido (solo cifre, 8-15 caratteri).';
      status.style.color = '#c96a5a';
      return;
    }
    telefono = telefonoPulito;

    if (GAS_URL.indexOf('http') !== 0) {
      status.textContent = 'Prenotazioni online non ancora attive: chiamaci per prenotare.';
      status.style.color = '#c96a5a';
      return;
    }

    sending = true;
    if (btn) btn.disabled = true;

    var form = document.getElementById('es-gas-form');
    form.action = GAS_URL;
    form.elements.nome.value = nome;
    form.elements.cognome.value = cognome;
    form.elements.telefono.value = telefono;
    form.elements.data.value = data;
    form.elements.persone.value = persone;
    form.elements.orario.value = orario;
    form.submit();

    status.textContent = 'Richiesta inviata! Ti contattiamo a breve per confermare.';
    status.style.color = '#6f9450';
  }
})();
</script>
</body>
</html>
